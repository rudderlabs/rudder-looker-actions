version: 2
updates:
  - package-ecosystem: "github-actions"
    # The composite actions under .github/actions pin actions too.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "rudderlabs/*"
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "@rudderlabs/*"
        - "@rudderstack/*"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      # Major updates match no group, so each one gets its own PR.
      npm-production:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Node patch releases carry security fixes, so the node base image skips the
  # cooldown. Dependabot does not update .nvmrc, engines or devEngines; the
  # version check in CI fails the PR until they match the new FROM tag.
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "node"
        - "rudderstack/*"
    # A Node major (an odd one is not LTS) is a planned upgrade, not a bot PR.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    groups:
      docker-base:
        applies-to: version-updates
        patterns:
          - "*"
