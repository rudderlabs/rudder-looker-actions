name: build image pr
on:
  pull_request:

permissions:
  contents: read

jobs:
  build-image:
    name: Build Docker Image (no push)
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout repository code (actions/checkout)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      # Build-only smoke test: verifies the Dockerfile still builds on every PR.
      # Publishing is owned by release-please (see release-please.yml), which
      # calls build-push-docker-image.yml once a release is actually cut.
      # The tag is only a local label for the build cache; nothing is pushed.
      # It must still be a valid Docker tag, so it cannot be derived from the
      # branch name -- branches like "chore/foo" contain slashes.
      - name: Build rudder-looker-actions
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: .
          push: false
          tags: rudderstack/action-hub:pr-${{ github.event.pull_request.number }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.event.pull_request.head.sha }}
