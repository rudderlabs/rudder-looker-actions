name: build and push image pr
on:
  pull_request:

permissions:
  contents: read

jobs:
  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      id-token: write # to request the OIDC JWT for AWS (configure-aws-credentials)
      contents: read # to checkout repository code (actions/checkout)
    env:
      # Fork PRs get neither secrets nor an OIDC token under `pull_request`,
      # so they build only. Same-repo PRs publish to both registries.
      CAN_PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false # nothing here talks to git after checkout

      # A branch name is not a valid Docker tag: "chore/foo" contains a slash.
      # docker/metadata-action used to do this for us -- it replaces invalid
      # char sequences with "-", strips a leading dot/dash and caps at 128
      # chars. Reproduced here so existing tags (e.g. chore-bump-axios-version)
      # keep the same names. head_ref goes through env, never interpolated
      # straight into the shell.
      - name: Compute image tag
        id: tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          img_tag=$(printf '%s' "$HEAD_REF" \
            | sed -E 's/[^a-zA-Z0-9_.-]+/-/g; s/^[.-]+//' \
            | cut -c1-128)
          # A branch of only invalid chars would sanitize to "", which would
          # push an untagged ":" reference.
          if [ -z "$img_tag" ]; then
            img_tag="pr-$PR_NUMBER"
          fi
          echo "img_tag=$img_tag" >> "$GITHUB_OUTPUT"
          echo "Image tag: $img_tag"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Configure AWS Credentials
        if: ${{ env.CAN_PUBLISH == 'true' }}
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ vars.AWS_ECR_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role-session-name: ${{ github.event.repository.name }}-build-push

      - name: Login to ECR
        if: ${{ env.CAN_PUBLISH == 'true' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # Tagged `pr-<number>`, not the branch name: the ECR lifecycle policy
      # expires images by tag prefix, and only `pr-` is collected (after 7
      # days). A branch-named tag would match no rule and live forever.
      - name: Build and Push Image to ECR
        if: ${{ env.CAN_PUBLISH == 'true' }}
        uses: rudderlabs/build-scan-push-action@865b4253caa57f8f20cd109e0efc1affe3a64939 # v2.2.0
        with:
          context: .
          push: true
          tags: ${{ format('{0}/rudderstack/action-hub:pr-{1}', steps.login-ecr.outputs.registry, github.event.pull_request.number) }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.event.pull_request.head.sha }}

      # TODO: Remove this once we have migrated to ECR.
      - name: Logging in to Docker
        if: ${{ env.CAN_PUBLISH == 'true' }}
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Fork PRs reach this step with push=false: a build-only smoke test that
      # verifies the Dockerfile still builds.
      # TODO: Remove the Docker Hub push once we have migrated to ECR.
      - name: Build and Push Image to DockerHub
        uses: rudderlabs/build-scan-push-action@865b4253caa57f8f20cd109e0efc1affe3a64939 # v2.2.0
        with:
          context: .
          push: ${{ env.CAN_PUBLISH == 'true' }}
          tags: rudderstack/action-hub:${{ steps.tag.outputs.img_tag }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ github.event.pull_request.head.sha }}
