name: build and push image pr

# The filename is load-bearing: the ECR IAM role's trust policy whitelists
# workflows by job_workflow_ref, and this file is the whitelisted entry for the
# pull_request context (rudder-devops, terraform/env/prod-ecr/ecr-repositories.tf).
# Renaming it, or moving the AWS credential step into a reusable workflow, would
# change the OIDC identity and break `sts:AssumeRoleWithWebIdentity`. The steps
# shared with publish-release.yml live in .github/actions/* instead: a composite
# action runs inside the calling job, so the identity stays this file.

on:
  pull_request:

permissions:
  contents: read

jobs:
  # A branch name is not a valid Docker tag: "chore/foo" contains a slash.
  # docker/metadata-action used to do this for us -- it replaces invalid char
  # sequences with "-", strips a leading dot/dash and caps at 128 chars.
  # Reproduced here so existing tags (e.g. chore-bump-axios-version) keep the
  # same names. head_ref goes through env, never interpolated straight into the
  # shell.
  get-image-tag:
    name: Compute image tag
    runs-on: ubuntu-latest
    permissions:
      contents: read # minimum required permission for job execution
    outputs:
      img_tag: ${{ steps.tag.outputs.img_tag }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Compute image tag
        id: tag
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          img_tag=$(printf '%s' "$HEAD_REF" \
            | sed -E 's/[^a-zA-Z0-9_.-]+/-/g; s/^[.-]+//' \
            | cut -c1-128)
          # A branch of only invalid chars would sanitize to "", which would
          # push an untagged ":" reference.
          if [ -z "$img_tag" ]; then
            img_tag="pr-$PR_NUMBER"
          fi
          echo "img_tag=$img_tag" >> "$GITHUB_OUTPUT"
          echo "Image tag: $img_tag"

  # Each architecture is built on a native runner and pushed under an
  # arch-suffixed tag; create-manifest-* then stitches them into the single
  # multi-arch tag consumers pull. This mirrors shopify-pixel-app and
  # rudder-transformer. Building both arches in one step would fall back to QEMU
  # emulation for arm64.
  build-images:
    name: Build Docker Image (${{ matrix.build-config.platform }})
    needs: [get-image-tag]
    permissions:
      id-token: write # to request the OIDC JWT for AWS (configure-aws-credentials)
      contents: read # to checkout repository code (actions/checkout)
    strategy:
      # Report each architecture independently; one arch failing should not
      # cancel the other and hide its result.
      fail-fast: false
      matrix:
        build-config:
          - os: [self-hosted, Linux, ARM64]
            arch: arm64
            platform: linux/arm64
          - os: [self-hosted, Linux, X64]
            arch: amd64
            platform: linux/amd64
    runs-on: ${{ matrix.build-config.os }}
    env:
      # Fork PRs get neither secrets nor an OIDC token under `pull_request`, so
      # they build only. Same-repo PRs publish to both registries. A boolean
      # expression casts to the string 'true' or 'false'.
      CAN_PUBLISH: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false # nothing here talks to git after checkout

      # ECR is tagged `pr-<number>` while Docker Hub keeps the branch name: the
      # ECR lifecycle policy expires images by tag prefix and only collects `pr-`
      # (7 days -- see ecr-lifecycle-policies.tf in rudder-devops), so a
      # branch-named tag there would match no rule and live forever. Docker Hub's
      # existing tags are branch-named, so those stay as they are.
      - name: Build and push image
        uses: ./.github/actions/build-push-image
        with:
          ecr_tag: rudderstack/action-hub:pr-${{ github.event.pull_request.number }}
          dockerhub_tag: rudderstack/action-hub:${{ needs.get-image-tag.outputs.img_tag }}
          arch: ${{ matrix.build-config.arch }}
          platform: ${{ matrix.build-config.platform }}
          version: ${{ github.event.pull_request.head.sha }}
          can_publish: ${{ env.CAN_PUBLISH }}
          aws_region: ${{ vars.AWS_ECR_REGION }}
          aws_iam_role: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role_session_name: ${{ github.event.repository.name }}-build-push
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Fork PRs pushed nothing, so there are no per-arch images to stitch.
  create-manifest-ecr:
    name: Create multi-arch manifest for ECR
    runs-on: ubuntu-latest
    needs: [build-images]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      id-token: write # to request the OIDC JWT for AWS (configure-aws-credentials)
      contents: read # to checkout repository code (actions/checkout)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      # A local composite action is only resolvable if the repo is checked out.
      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Create multi-arch manifest for ECR
        uses: ./.github/actions/create-manifest
        with:
          registry: ecr
          image_tag: rudderstack/action-hub:pr-${{ github.event.pull_request.number }}
          aws_region: ${{ vars.AWS_ECR_REGION }}
          aws_iam_role: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role_session_name: ${{ github.event.repository.name }}-manifest

  # TODO: Remove this once we have migrated to ECR.
  # Fork PRs pushed nothing, so there are no per-arch images to stitch.
  create-manifest-dockerhub:
    name: Create multi-arch manifest for DockerHub
    runs-on: ubuntu-latest
    needs: [get-image-tag, build-images]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read # to checkout repository code (actions/checkout)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      # A local composite action is only resolvable if the repo is checked out.
      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Create multi-arch manifest for DockerHub
        uses: ./.github/actions/create-manifest
        with:
          registry: dockerhub
          image_tag: rudderstack/action-hub:${{ needs.get-image-tag.outputs.img_tag }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
