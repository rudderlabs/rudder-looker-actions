name: Test and Report Code Coverage
on:
  workflow_call:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # actions/checkout

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'yarn'

      # .nvmrc is the one Node version source. The check fails when the
      # Dockerfile, engines or devEngines name another version.
      - name: Check the Node version sources agree
        run: scripts/check-node-version.sh

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Tests & Coverage
        run: |
          npm run test-coverage

      # - name: Run Lint Checks
      #   run: |
      #     npm run check:lint
      #     npm run lint:fix

      - name: Upload Coverage Reports to Codecov
        if: always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage

      - name: Fix filesystem paths in generated reports
        if: always()
        run: |
          sed -i 's+home/runner/work/rudder-looker-actions/rudder-looker-actions+/github/workspace+g' coverage/lcov.info
          # sed -i 's+/home/runner/work/rudder-auth/rudder-auth+/github/workspace+g' reports/eslint.json

      # - name: SonarCloud Scan
      #   if: always()
      #   uses: SonarSource/sonarcloud-github-action@v2.0.0
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
