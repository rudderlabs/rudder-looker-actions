name: Build and Push Docker Image

# Shared by the PR path (build-pr-artifacts.yml) and the release path
# (publish-release.yml). Each architecture is built on a native runner and
# pushed under an arch-suffixed tag; the create-manifest-* jobs then stitch
# those into the single multi-arch tag consumers pull. This mirrors
# shopify-pixel-app and rudder-transformer. Building both arches in one step
# would fall back to QEMU emulation for arm64.

on:
  workflow_call:
    inputs:
      ecr_tag:
        description: >-
          ECR tag without the registry host, e.g. "rudderstack/action-hub:pr-62".
          The registry host is prepended from the ECR login. Differs from
          dockerhub_tag on PRs: the ECR lifecycle policy expires images by tag
          prefix and only collects `pr-`, so a branch-named tag would match no
          rule and live forever.
        required: true
        type: string
      dockerhub_tag:
        description: 'Docker Hub tag, e.g. "rudderstack/action-hub:1.4.1".'
        required: true
        type: string
      version:
        description: 'Value for the VERSION build-arg (release tag, or head SHA on PRs).'
        required: true
        type: string
      ref:
        description: 'Commit to check out. Defaults to the triggering ref.'
        required: false
        type: string
        default: ''
      can_publish:
        description: >-
          true to push to both registries. false builds only, skipping every
          credentialed step and both manifest jobs -- fork PRs get neither
          secrets nor an OIDC token under `pull_request`, so the build still runs
          as a smoke test.
        required: false
        type: boolean
        default: true
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  id-token: write # allows the JWT to be requested from GitHub's OIDC provider
  contents: read # required for actions/checkout

jobs:
  build-images:
    name: Build Docker Image (${{ matrix.build-config.platform }})
    permissions:
      id-token: write # to request the OIDC JWT for AWS (configure-aws-credentials)
      contents: read # to checkout repository code (actions/checkout)
    strategy:
      matrix:
        build-config:
          - os: [self-hosted, Linux, ARM64]
            arch: arm64
            platform: linux/arm64
          - os: [self-hosted, Linux, X64]
            arch: amd64
            platform: linux/amd64
    runs-on: ${{ matrix.build-config.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false # nothing here talks to git after checkout

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Configure AWS Credentials
        if: ${{ inputs.can_publish }}
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ vars.AWS_ECR_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role-session-name: ${{ github.event.repository.name }}-build-push

      - name: Login to ECR
        if: ${{ inputs.can_publish }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and Push Image to ECR
        if: ${{ inputs.can_publish }}
        uses: rudderlabs/build-scan-push-action@865b4253caa57f8f20cd109e0efc1affe3a64939 # v2.2.0
        with:
          context: .
          push: true
          tags: ${{ format('{0}/{1}-{2}', steps.login-ecr.outputs.registry, inputs.ecr_tag, matrix.build-config.arch) }}
          platforms: ${{ matrix.build-config.platform }}
          build-args: |
            VERSION=${{ inputs.version }}

      # TODO: Remove this once we have migrated to ECR. The rudder-devops helm
      # chart still pins the Docker Hub image.
      - name: Logging in to Docker
        if: ${{ inputs.can_publish }}
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reached with push=false on fork PRs: a build-only smoke test that
      # verifies the Dockerfile still builds.
      # TODO: Remove the Docker Hub push once we have migrated to ECR.
      - name: Build and Push Image to DockerHub
        uses: rudderlabs/build-scan-push-action@865b4253caa57f8f20cd109e0efc1affe3a64939 # v2.2.0
        with:
          context: .
          push: ${{ inputs.can_publish }}
          tags: ${{ inputs.dockerhub_tag }}-${{ matrix.build-config.arch }}
          platforms: ${{ matrix.build-config.platform }}
          build-args: |
            VERSION=${{ inputs.version }}

  # Fork PRs pushed nothing, so there are no per-arch images to stitch.
  create-manifest-ecr:
    name: Create multi-arch manifest for ECR
    runs-on: ubuntu-latest
    needs: [build-images]
    if: ${{ inputs.can_publish }}
    permissions:
      id-token: write # to request the OIDC JWT for AWS (configure-aws-credentials)
      contents: read # minimum required permission for job execution
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ vars.AWS_ECR_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role-session-name: ${{ github.event.repository.name }}-manifest

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Create multi-arch manifest for ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_TAG: ${{ inputs.ecr_tag }}
        run: |
          tag="$ECR_REGISTRY/$ECR_TAG"
          docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"

  # TODO: Remove this once we have migrated to ECR.
  # Fork PRs pushed nothing, so there are no per-arch images to stitch.
  create-manifest-dockerhub:
    name: Create multi-arch manifest for DockerHub
    runs-on: ubuntu-latest
    needs: [build-images]
    if: ${{ inputs.can_publish }}
    permissions:
      contents: read # minimum required permission for job execution
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Logging in to Docker
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest for DockerHub
        env:
          DOCKERHUB_TAG: ${{ inputs.dockerhub_tag }}
        run: |
          tag="$DOCKERHUB_TAG"
          docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"
