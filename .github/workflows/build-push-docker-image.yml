name: Build and Push Docker Image

on:
  workflow_call:
    inputs:
      image_repo:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  build-and-push-image:
    name: Build and Push ${{ inputs.image_repo }}:${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # to checkout repository code (actions/checkout)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Logging in to Docker
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push rudder-looker-actions
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: .
          push: true
          tags: ${{ format('{0}:{1}', inputs.image_repo, inputs.image_tag) }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ inputs.image_tag }}

  create-pull-request-devops:
    name: Create PR for looker-action-hub (devops)
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    permissions:
      contents: read # cross-repo writes use the app token below
    env:
      TAG_NAME: ${{ inputs.image_tag }}
      IMAGE_REPO: ${{ inputs.image_repo }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create commits and push branches
          permission-pull-requests: write # to create PRs
          repositories: rudder-devops # to access rudder-devops repository

      - name: Checkout Devops Repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          repository: rudderlabs/rudder-devops
          token: ${{ steps.generate-token.outputs.token }}

      - name: Update image tags in devops repo
        run: |
          cd helm-charts/helm/looker-action-hub/environment
          yq eval -i ".actionhubImage.image=\"$IMAGE_REPO:$TAG_NAME\"" staging/base.yaml
          yq eval -i ".actionhubImage.image=\"$IMAGE_REPO:$TAG_NAME\"" prod/base.yaml

      - name: Create release branch on remote
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          gh api repos/rudderlabs/rudder-devops/git/refs \
            --method POST \
            -f ref="refs/heads/rudder-looker-actions-$TAG_NAME" \
            -f sha="$BASE_SHA"

      - name: Create verified commit via GitHub API
        uses: ryancyq/github-signed-commit@e9f3b28c80da7be66d24b8f501a5abe82a6b855f # v1.2.0
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          repository: rudderlabs/rudder-devops
          branch-name: rudder-looker-actions-${{ env.TAG_NAME }}
          commit-message: 'chore: upgrade looker-action to ${{ env.TAG_NAME }}'
          files: |
            helm-charts/helm/looker-action-hub/environment/staging/base.yaml
            helm-charts/helm/looker-action-hub/environment/prod/base.yaml

      - name: Create PR in devops repo
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh pr create \
            --repo rudderlabs/rudder-devops \
            --base master \
            --head "rudder-looker-actions-$TAG_NAME" \
            --title "chore: upgrade looker-action to $TAG_NAME" \
            --body "Automated PR to update staging and production looker-action-hub images to $TAG_NAME"
