name: Publish Release

on:
  workflow_call:
    inputs:
      image_repo:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      # Secrets are not inherited by reusable workflows unless declared here
      # and passed by the caller (or via `secrets: inherit`).
      RELEASE_PRIVATE_KEY:
        required: true

permissions:
  id-token: write # allows the JWT to be requested from GitHub's OIDC provider
  contents: read # required for actions/checkout

jobs:
  # Each architecture is built on a native runner and pushed under an
  # arch-suffixed tag; create-manifest-* then stitches them into the single
  # multi-arch tag consumers pull. This mirrors shopify-pixel-app and
  # rudder-transformer. Building both arches in one step would fall back to QEMU
  # emulation for arm64.
  #
  # The steps live in .github/actions/*, shared with build-and-push-docker-image.yml.
  # They are a composite action rather than a reusable workflow on purpose: the
  # ECR IAM role whitelists workflows by job_workflow_ref, which names the CALLEE,
  # and only this file is whitelisted for the master context. A composite action
  # runs inside this job, so the OIDC identity stays this file.
  build-images:
    name: Build ${{ inputs.image_repo }}:${{ inputs.image_tag }} (${{ matrix.build-config.platform }})
    permissions:
      id-token: write # to request the OIDC JWT for AWS (configure-aws-credentials)
      contents: read # to checkout repository code (actions/checkout)
    strategy:
      # Report each architecture independently; one arch failing should not
      # cancel the other and hide its result.
      fail-fast: false
      matrix:
        build-config:
          - os: [self-hosted, Linux, ARM64]
            arch: arm64
            platform: linux/arm64
          - os: [self-hosted, Linux, X64]
            arch: amd64
            platform: linux/amd64
    runs-on: ${{ matrix.build-config.os }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false # nothing here talks to git after checkout

      - name: Build and push image
        uses: ./.github/actions/build-push-image
        with:
          ecr_tag: ${{ format('{0}:{1}', inputs.image_repo, inputs.image_tag) }}
          dockerhub_tag: ${{ format('{0}:{1}', inputs.image_repo, inputs.image_tag) }}
          arch: ${{ matrix.build-config.arch }}
          platform: ${{ matrix.build-config.platform }}
          version: ${{ inputs.image_tag }}
          can_publish: 'true' # release builds always publish
          aws_region: ${{ vars.AWS_ECR_REGION }}
          aws_iam_role: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role_session_name: ${{ github.event.repository.name }}-build-push
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  create-manifest-ecr:
    name: Create multi-arch manifest for ECR
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      id-token: write # to request the OIDC JWT for AWS (configure-aws-credentials)
      contents: read # to checkout repository code (actions/checkout)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      # A local composite action is only resolvable if the repo is checked out.
      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Create multi-arch manifest for ECR
        uses: ./.github/actions/create-manifest
        with:
          registry: ecr
          image_tag: ${{ format('{0}:{1}', inputs.image_repo, inputs.image_tag) }}
          aws_region: ${{ vars.AWS_ECR_REGION }}
          aws_iam_role: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role_session_name: ${{ github.event.repository.name }}-manifest

  # TODO: Remove this once we have migrated to ECR.
  create-manifest-dockerhub:
    name: Create multi-arch manifest for DockerHub
    runs-on: ubuntu-latest
    needs: [build-images]
    permissions:
      contents: read # to checkout repository code (actions/checkout)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      # A local composite action is only resolvable if the repo is checked out.
      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Create multi-arch manifest for DockerHub
        uses: ./.github/actions/create-manifest
        with:
          registry: dockerhub
          image_tag: ${{ format('{0}:{1}', inputs.image_repo, inputs.image_tag) }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  create-pull-request-devops:
    name: Create ${{ matrix.environment }} PR for looker-action-hub (devops)
    runs-on: ubuntu-latest
    needs: [create-manifest-ecr, create-manifest-dockerhub]
    permissions:
      contents: read # cross-repo writes use the app token below
    strategy:
      # One PR per environment so staging can be merged and soaked before prod.
      # Serialized: both legs branch off rudder-devops master and would
      # otherwise race when pushing their branches.
      max-parallel: 1
      fail-fast: false
      matrix:
        environment: [staging, prod]
    env:
      TAG_NAME: ${{ inputs.image_tag }}
      IMAGE_REPO: ${{ inputs.image_repo }}
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create commits and push branches
          permission-pull-requests: write # to create PRs
          repositories: rudder-devops # to access rudder-devops repository

      - name: Checkout Devops Repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          repository: rudderlabs/rudder-devops
          ref: master # base the release branch on an explicit ref, not "whatever HEAD is"
          token: ${{ steps.generate-token.outputs.token }}
          # Must persist: github-signed-commit runs `git push` for the new
          # branch, which needs the credential in the local git config. The
          # token is a short-lived App token scoped to rudder-devops only.
          persist-credentials: true

      - name: Update image tag in devops repo
        run: |
          cd "helm-charts/helm/looker-action-hub/environment/$ENVIRONMENT"
          yq eval -i ".actionhubImage.image=\"$IMAGE_REPO:$TAG_NAME\"" base.yaml

      # The branch is not created here: github-signed-commit runs
      # `git checkout -b <branch>` + `git push --set-upstream origin HEAD`
      # itself. Creating it up front via `gh api .../git/refs` duplicated that
      # work and made re-runs fail with HTTP 422 (reference already exists).

      - name: Create verified commit via GitHub API
        # v1.4.0 is the first tagged release with the `repository` input, which
        # is required to target rudder-devops (v1.2.0 silently ignores it and
        # would commit to this repo instead).
        uses: ryancyq/github-signed-commit@6afa32d8aa9819faddc248e6258e9c11ec05ecc8 # v1.4.0
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          repository: rudderlabs/rudder-devops
          branch-name: rudder-looker-actions-${{ env.ENVIRONMENT }}-${{ env.TAG_NAME }}
          commit-message: 'chore: upgrade looker-action ${{ env.ENVIRONMENT }} to ${{ env.TAG_NAME }}'
          files: |
            helm-charts/helm/looker-action-hub/environment/${{ matrix.environment }}/base.yaml

      - name: Create PR in devops repo
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh pr create \
            --repo rudderlabs/rudder-devops \
            --base master \
            --head "rudder-looker-actions-$ENVIRONMENT-$TAG_NAME" \
            --title "chore: upgrade looker-action $ENVIRONMENT to $TAG_NAME" \
            --body "Automated PR to update the $ENVIRONMENT looker-action-hub image to $TAG_NAME"
