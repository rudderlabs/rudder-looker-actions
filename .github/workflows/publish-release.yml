name: Publish Release

on:
  workflow_call:
    inputs:
      image_repo:
        required: true
        type: string
      image_tag:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      # Secrets are not inherited by reusable workflows unless declared here
      # and passed by the caller (or via `secrets: inherit`).
      RELEASE_PRIVATE_KEY:
        required: true

permissions:
  id-token: write # allows the JWT to be requested from GitHub's OIDC provider
  contents: read # required for actions/checkout

jobs:
  build-and-push-image:
    name: Build and Push ${{ inputs.image_repo }}:${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # to request the OIDC JWT for AWS (configure-aws-credentials)
      contents: read # to checkout repository code (actions/checkout)
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Check out repository code
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false # nothing here talks to git after checkout

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
        with:
          aws-region: ${{ vars.AWS_ECR_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_IAM_ROLE_ARN }}
          role-session-name: ${{ github.event.repository.name }}-build-push

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and Push Image to ECR
        uses: rudderlabs/build-scan-push-action@865b4253caa57f8f20cd109e0efc1affe3a64939 # v2.2.0
        with:
          context: .
          push: true
          tags: ${{ format('{0}/{1}:{2}', steps.login-ecr.outputs.registry, inputs.image_repo, inputs.image_tag) }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ inputs.image_tag }}

      # TODO: Remove this once we have migrated to ECR. The rudder-devops helm
      # chart still pins the Docker Hub image.
      - name: Logging in to Docker
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # TODO: Remove this once we have migrated to ECR.
      - name: Build and Push Image to DockerHub
        uses: rudderlabs/build-scan-push-action@865b4253caa57f8f20cd109e0efc1affe3a64939 # v2.2.0
        with:
          context: .
          push: true
          tags: ${{ format('{0}:{1}', inputs.image_repo, inputs.image_tag) }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ inputs.image_tag }}

  create-pull-request-devops:
    name: Create ${{ matrix.environment }} PR for looker-action-hub (devops)
    runs-on: ubuntu-latest
    needs: [build-and-push-image]
    permissions:
      contents: read # cross-repo writes use the app token below
    strategy:
      # One PR per environment so staging can be merged and soaked before prod.
      # Serialized: both legs branch off rudder-devops master and would
      # otherwise race when pushing their branches.
      max-parallel: 1
      fail-fast: false
      matrix:
        environment: [staging, prod]
    env:
      TAG_NAME: ${{ inputs.image_tag }}
      IMAGE_REPO: ${{ inputs.image_repo }}
      ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write # to create commits and push branches
          permission-pull-requests: write # to create PRs
          repositories: rudder-devops # to access rudder-devops repository

      - name: Checkout Devops Repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          repository: rudderlabs/rudder-devops
          ref: master # base the release branch on an explicit ref, not "whatever HEAD is"
          token: ${{ steps.generate-token.outputs.token }}
          # Must persist: github-signed-commit runs `git push` for the new
          # branch, which needs the credential in the local git config. The
          # token is a short-lived App token scoped to rudder-devops only.
          persist-credentials: true

      - name: Update image tag in devops repo
        run: |
          cd "helm-charts/helm/looker-action-hub/environment/$ENVIRONMENT"
          yq eval -i ".actionhubImage.image=\"$IMAGE_REPO:$TAG_NAME\"" base.yaml

      # The branch is not created here: github-signed-commit runs
      # `git checkout -b <branch>` + `git push --set-upstream origin HEAD`
      # itself. Creating it up front via `gh api .../git/refs` duplicated that
      # work and made re-runs fail with HTTP 422 (reference already exists).

      - name: Create verified commit via GitHub API
        # v1.4.0 is the first tagged release with the `repository` input, which
        # is required to target rudder-devops (v1.2.0 silently ignores it and
        # would commit to this repo instead).
        uses: ryancyq/github-signed-commit@6afa32d8aa9819faddc248e6258e9c11ec05ecc8 # v1.4.0
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        with:
          repository: rudderlabs/rudder-devops
          branch-name: rudder-looker-actions-${{ env.ENVIRONMENT }}-${{ env.TAG_NAME }}
          commit-message: 'chore: upgrade looker-action ${{ env.ENVIRONMENT }} to ${{ env.TAG_NAME }}'
          files: |
            helm-charts/helm/looker-action-hub/environment/${{ matrix.environment }}/base.yaml

      - name: Create PR in devops repo
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh pr create \
            --repo rudderlabs/rudder-devops \
            --base master \
            --head "rudder-looker-actions-$ENVIRONMENT-$TAG_NAME" \
            --title "chore: upgrade looker-action $ENVIRONMENT to $TAG_NAME" \
            --body "Automated PR to update the $ENVIRONMENT looker-action-hub image to $TAG_NAME"
