name: 'Create Multi-arch Manifest'
description: >-
  Stitch the per-arch tags pushed by build-push-image ("<tag>-amd64",
  "<tag>-arm64") into the single multi-arch tag consumers pull.

inputs:
  registry:
    description: 'Which registry to publish the manifest to: ecr or dockerhub.'
    required: true
  image_tag:
    description: >-
      Tag WITHOUT the registry host or the arch suffix, e.g.
      "rudderstack/action-hub:pr-62". For ECR the registry host is prepended
      from the ECR login.
    required: true
  aws_region:
    required: false
    default: ''
  aws_iam_role:
    required: false
    default: ''
  role_session_name:
    required: false
    default: ''
  dockerhub_username:
    required: false
    default: ''
  dockerhub_token:
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Configure AWS Credentials
      if: ${{ inputs.registry == 'ecr' }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-region: ${{ inputs.aws_region }}
        role-to-assume: ${{ inputs.aws_iam_role }}
        role-session-name: ${{ inputs.role_session_name }}

    - name: Login to ECR
      if: ${{ inputs.registry == 'ecr' }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    # TODO: Remove this once we have migrated to ECR.
    - name: Logging in to Docker
      if: ${{ inputs.registry == 'dockerhub' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Create multi-arch manifest
      shell: bash
      env:
        # Empty for Docker Hub; the ECR login output carries the registry host.
        REGISTRY_HOST: ${{ inputs.registry == 'ecr' && format('{0}/', steps.login-ecr.outputs.registry) || '' }}
        IMAGE_TAG: ${{ inputs.image_tag }}
      run: |
        tag="$REGISTRY_HOST$IMAGE_TAG"
        docker buildx imagetools create -t "$tag" "$tag-amd64" "$tag-arm64"
